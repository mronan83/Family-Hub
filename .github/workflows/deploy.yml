# Ordered production deploy (01 §9.6): gate, then migrations, then the app, then a smoke check.
# The PR gates are enforced here (D-36): only the head of main deploys, and only if it came from a
# merged pull request and the fast CI checks passed on it and on its pull request's head. No e2e
# result is read: e2e runs nightly and never blocks a deploy (D-108). A refused or failed deploy
# opens or updates the issue "Deploy refused: <commit>". Migrations go through the Supabase session
# pooler (IPv4; the Free plan's direct connection is IPv6-only). Enabled once the secrets in 01 §9.8 exist: set the repository variable
# DEPLOY_ENABLED=true.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  gate:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      deploy: ${{ steps.check.outputs.deploy }}
      reason: ${{ steps.check.outputs.reason }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CI_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual' }}
      HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      # The gate logic lives in a script so its refusals are tested (scripts/deploy-gate.test.mjs).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/deploy-gate.sh
          sparse-checkout-cone-mode: false
      - id: check
        run: bash scripts/deploy-gate.sh

  migrate:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      # Not `supabase db push`: it refuses when an open pull request's preview has applied a
      # migration this commit lacks (one database, D-37). The runner reports those and carries on.
      - run: bash scripts/db-migrate.sh

  app:
    needs: [gate, migrate]
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global vercel@59.23.2
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  smoke:
    needs: app
    runs-on: ubuntu-24.04
    steps:
      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ vars.PRODUCTION_URL }}/api/health" | grep -q '"status":"ok"'; then exit 0; fi
            sleep $((i * 5))
          done
          echo "production health check failed" >&2
          exit 1

  # pg_cron jobs and job_health's cadences follow apps/web/lib/jobs/schedule.json (01 §5.6). After the
  # smoke check, so no schedule calls an app that cannot answer it yet.
  schedule:
    needs: [gate, smoke]
    runs-on: ubuntu-24.04
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Sync job schedules
        run: node scripts/job-schedules.mjs | psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 --single-transaction

  # A refused or failed deploy opens or updates one issue saying why (D-108). A skip is not a refusal.
  report:
    needs: [gate, migrate, app, smoke, schedule]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.gate.outputs.sha || github.event.workflow_run.head_sha || github.sha }}
      REASON: ${{ needs.gate.outputs.reason }}
      RESULTS: >-
        gate ${{ needs.gate.result }}, migrate ${{ needs.migrate.result }}, app ${{ needs.app.result }},
        smoke ${{ needs.smoke.result }}, schedule ${{ needs.schedule.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/open-issue.sh
          sparse-checkout-cone-mode: false
      - name: Open or update "Deploy refused"
        run: |
          body="Commit $SHA was not deployed.

          Reason: ${REASON:-a deploy job failed; see the run}
          Jobs: $RESULTS
          Run: $RUN_URL"
          bash scripts/open-issue.sh "Deploy refused: ${SHA:0:7}" "$body"
