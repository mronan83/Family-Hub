# SPIKE-05 measurement (01 §5.6): when a claude/spike-05* branch's Vercel preview is ready, pg_net in
# the production database calls the probe on that preview, the way pg_cron jobs will call the job
# endpoints, and the results land in the run's summary. Runs only for those branches; to measure
# again (for example after Vercel changes its limits), push a branch with that prefix.
#
# It has its own concurrency group, so it never displaces an e2e run, and applies no migrations
# itself: e2e on the same preview enables pg_cron and pg_net, and the script waits for them.
name: spike-05

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: spike-05
  cancel-in-progress: false

jobs:
  measure:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      # Vercel's deployment events do not name the branch reliably, so ask GitHub which branches
      # point at the deployed commit.
      - name: Only for claude/spike-05* branches
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
          REF: ${{ github.event.deployment.ref }}
        run: |
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/branches-where-head" --jq '.[].name' || true)
          echo "deployment ref: $REF; branches at ${SHA:0:7}: ${heads:-none}"
          if printf '%s\n%s\n' "$REF" "$heads" | grep -q '^claude/spike-05'; then
            echo "spike=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.branch.outputs.spike == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Measure
        if: steps.branch.outputs.spike == 'true'
        run: bash scripts/spike-05.sh
      - name: Remove the temporary cron job
        if: always() && steps.branch.outputs.spike == 'true'
        run: psql "$SUPABASE_DB_URL" -X -q -c "select cron.unschedule(jobid) from cron.job where jobname = 'spike-05-cron'" || true
