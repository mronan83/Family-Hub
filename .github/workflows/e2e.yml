# e2e on each Vercel preview (01 §9.3, §9.5, D-85). Previews and e2e use the test database, a second
# Supabase project that holds only made-up families; production's database never sees a test. Each
# run empties the test database, applies every migration in the pull request, loads the demo family,
# then runs Playwright against the preview URL through Vercel deployment protection. Runs are
# serialized so two never share the test database at once.
name: e2e

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: demo-family
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-24.04
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # The test project (D-85); scripts/preview-db.sh refuses any other database.
      SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
      TEST_PROJECT_REF: puoctwssryisuzakhzxj
    steps:
      - name: Check configuration
        run: |
          missing=()
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || missing+=(VERCEL_AUTOMATION_BYPASS_SECRET)
          [ -n "$SUPABASE_DB_URL" ] || missing+=(TEST_SUPABASE_DB_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::e2e is not configured yet; missing: ${missing[*]} (docs/01-technical-architecture.md §9.8)"
            exit 1
          fi
      # The repository is public (D-48): the database credential only ever meets code already on one
      # of this repository's own branches, never a fork's, even if a fork's preview were deployed.
      - name: Only this repository's own commits
        env:
          SHA: ${{ github.event.deployment.sha }}
        run: |
          git init -q "$RUNNER_TEMP/own" && cd "$RUNNER_TEMP/own"
          git fetch -q --filter=blob:none "https://github.com/$GITHUB_REPOSITORY" '+refs/heads/*:refs/remotes/origin/*'
          if git cat-file -e "$SHA^{commit}" 2>/dev/null && [ -n "$(git branch -r --contains "$SHA")" ]; then
            echo "commit $SHA is on a branch of $GITHUB_REPOSITORY"
          else
            echo "::error::commit $SHA is on no branch of this repository; not running it with the database credential"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      # The reset seeds the demo family's history from its own today, and a run takes about 10
      # minutes. One that crossed the family's midnight would compare yesterday's seed with today's
      # dates (it did once, at 04:00 UTC: a calendar window and a streak date each off by a day), so
      # a run that would end past that midnight waits for it to pass, then resets and runs.
      - name: Not across the demo family's midnight
        run: |
          # Before the first run the test database is empty: the demo family's own time zone then.
          tz=$(psql "$SUPABASE_DB_URL" -AtX -c "select timezone from public.household where id = '0de00000-0000-4000-8000-000000000001'" 2>/dev/null || true)
          tz=${tz:-America/New_York}
          left=$(( $(TZ="$tz" date -d 'tomorrow 00:00' +%s) - $(date +%s) ))
          if [ "$left" -lt 1500 ]; then
            echo "The demo family's midnight ($tz) is ${left} s away: waiting for it to pass."
            sleep $(( left + 30 ))
          fi
      - name: Empty the test database, apply this PR's migrations, load the demo family
        run: bash scripts/preview-db.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_REPORT: ${{ runner.temp }}/e2e-report.txt
      - name: Measurements (DEV-05 latency, WP-08 list entry)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e-report.txt" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/e2e-report.txt"
          fi
      # Traces record request headers, the deployment-protection bypass among them, and a public
      # repository's artifacts are public (D-48): the report is kept only while the repository is private.
      - if: failure() && github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
