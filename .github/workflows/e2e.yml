# e2e on each Vercel preview (01 §9.3, §9.5). Supabase Free has no per-PR branches, so previews share
# one free "preview" project. Each run rebuilds that database from this commit's migrations, seeds it,
# then runs Playwright against the preview URL through Vercel deployment protection. Runs are
# serialized so two PRs never share the database at the same time.
name: e2e

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: preview-database
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-24.04
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PREVIEW_DB_URL: ${{ secrets.PREVIEW_DB_URL }}
      SUPABASE_PREVIEW_PROJECT_ID: ${{ vars.SUPABASE_PREVIEW_PROJECT_ID }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=()
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || missing+=(VERCEL_AUTOMATION_BYPASS_SECRET)
          [ -n "$PREVIEW_DB_URL" ] || missing+=(PREVIEW_DB_URL)
          [ -n "$SUPABASE_PREVIEW_PROJECT_ID" ] || missing+=(SUPABASE_PREVIEW_PROJECT_ID)
          [ -n "$SUPABASE_PROJECT_ID" ] || missing+=(SUPABASE_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::e2e is not configured yet; missing: ${missing[*]} (docs/01-technical-architecture.md §9.8)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Rebuild the preview database
        run: bash scripts/preview-db.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
