# e2e on each Vercel preview (01 §9.3, §9.5, D-37). Previews use the one Supabase database and run
# as the demo family, a separate household that RLS keeps apart from every real one. Each run applies
# the pull request's new migrations (unless one removes or renames something; those wait for the
# deploy), resets the demo family, then runs Playwright against the preview URL through Vercel
# deployment protection. Runs are serialized so two previews never reset the demo family at once.
name: e2e

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: demo-family
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-24.04
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check configuration
        run: |
          missing=()
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || missing+=(VERCEL_AUTOMATION_BYPASS_SECRET)
          [ -n "$SUPABASE_DB_URL" ] || missing+=(SUPABASE_DB_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::e2e is not configured yet; missing: ${missing[*]} (docs/01-technical-architecture.md §9.8)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Apply new migrations and reset the demo family
        run: bash scripts/preview-db.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_REPORT: ${{ runner.temp }}/e2e-report.txt
      - name: Measurements (DEV-05 latency, WP-08 list entry)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e-report.txt" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/e2e-report.txt"
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
