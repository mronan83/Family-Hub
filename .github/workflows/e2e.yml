# e2e on each Vercel preview (01 §9.3, §9.5, D-85, D-104). Previews and e2e use the test database, a
# second Supabase project that holds only made-up families; production's database never sees a test.
#
# scope    which specs this pull request needs, from what its diff changes (scripts/e2e-scope.mjs):
#          none (docs and the like), the specs for the areas it touches, or all of them
# run      only when some spec is needed: holds the test database (scripts/e2e-lock.sh; runs queue on
#          the database, none is replaced), empties it, applies the pull request's migrations, loads
#          the demo family, then runs the specs against the preview (scripts/e2e-run.mjs): changed
#          specs five times each, and an infrastructure failure re-run once with its cause
# preview  the verdict the deploy gate reads: green when no spec was needed or every spec passed
#
# The full suite runs on main after each deploy and nightly (e2e-main.yml).
name: e2e

on:
  deployment_status:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  scope:
    # Previews of pull requests only: not production, and not main's own previews (e2e-main.yml).
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production' &&
      github.event.deployment.ref != 'main'
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      mode: ${{ steps.scope.outputs.mode }}
      specs: ${{ steps.scope.outputs.specs }}
      burn_in: ${{ steps.scope.outputs.burn_in }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
      # Vercel's deployment names the commit, not the branch; the pull request's branch keys the
      # cancelling of this branch's older run (run's concurrency group).
      - id: branch
        name: The pull request's branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")][0].head.ref // empty' || true)
          echo "branch=${branch:-$SHA}" >> "$GITHUB_OUTPUT"
          echo "branch: ${branch:-$SHA (no open pull request)}"
      - id: scope
        name: Which specs this change needs
        run: |
          node scripts/e2e-scope.mjs --base origin/main --head HEAD --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/scope.json"
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const lines = [`## e2e scope: ${s.mode}`, "",
              s.mode === "none" ? "No spec covers what changed: e2e is not needed." :
              s.mode === "all" ? `All ${s.specs.length} specs: ${s.reasons.at(-1)}.` :
              `${s.specs.length} spec(s): ${s.specs.join(", ")}`,
              ...(s.burnIn.length ? ["", `Burn-in, 5 runs each: ${s.burnIn.join(", ")}`] : []),
              "", "<details><summary>Why</summary>", "", ...s.reasons.map((r) => `- ${r}`), "", "</details>"];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          ' "$RUNNER_TEMP/scope.json"

  run:
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # A newer push to the same branch replaces this branch's run; another branch's run is never touched.
    concurrency:
      group: e2e-${{ needs.scope.outputs.branch }}
      cancel-in-progress: true
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # The test project (D-85); scripts/preview-db.sh refuses any other database.
      SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
      TEST_PROJECT_REF: puoctwssryisuzakhzxj
    steps:
      - name: Check configuration
        run: |
          missing=()
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || missing+=(VERCEL_AUTOMATION_BYPASS_SECRET)
          [ -n "$SUPABASE_DB_URL" ] || missing+=(TEST_SUPABASE_DB_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::e2e is not configured yet; missing: ${missing[*]} (docs/01-technical-architecture.md §9.8)"
            exit 1
          fi
      # The repository is public (D-48): the database credential only ever meets code already on one
      # of this repository's own branches, never a fork's, even if a fork's preview were deployed.
      - name: Only this repository's own commits
        env:
          SHA: ${{ github.event.deployment.sha }}
        run: |
          git init -q "$RUNNER_TEMP/own" && cd "$RUNNER_TEMP/own"
          git fetch -q --filter=blob:none "https://github.com/$GITHUB_REPOSITORY" '+refs/heads/*:refs/remotes/origin/*'
          if git cat-file -e "$SHA^{commit}" 2>/dev/null && [ -n "$(git branch -r --contains "$SHA")" ]; then
            echo "commit $SHA is on a branch of $GITHUB_REPOSITORY"
          else
            echo "::error::commit $SHA is on no branch of this repository; not running it with the database credential"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for the preview to answer
        env:
          E2E_SHA: ${{ github.event.deployment.sha }}
        run: bash scripts/e2e-ready.sh
      - name: Hold the test database
        env:
          E2E_LOCK_RUN: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e2e-lock.sh acquire
      - name: Empty the test database, apply this PR's migrations, load the demo family
        run: bash scripts/preview-db.sh
      - name: e2e
        env:
          E2E_REPORT: ${{ runner.temp }}/e2e-report.txt
        run: >-
          node scripts/e2e-run.mjs
          --specs "${{ needs.scope.outputs.mode == 'all' && ' ' || needs.scope.outputs.specs }}"
          --burn-in "${{ needs.scope.outputs.burn_in }}"
      - name: Let go of the test database
        if: always()
        run: bash scripts/e2e-lock.sh release
      - name: Measurements (DEV-05 latency, WP-08 list entry)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e-report.txt" ]; then
            { echo '### Measurements'; echo; cat "$RUNNER_TEMP/e2e-report.txt"; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # Traces record request headers, the deployment-protection bypass among them, and a public
      # repository's artifacts are public (D-48): the report is kept only while the repository is private.
      - if: failure() && github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  preview:
    needs: [scope, run]
    if: always() && needs.scope.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Verdict
        env:
          SCOPE: ${{ needs.scope.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          RUN: ${{ needs.run.result }}
        run: |
          if [ "$SCOPE" != success ]; then echo "::error::the scope job ended '$SCOPE'"; exit 1; fi
          if [ "$MODE" = none ]; then echo "No spec covers what changed: e2e is not needed (D-104)."; exit 0; fi
          if [ "$RUN" = cancelled ]; then echo "::error::replaced by a newer push to this branch"; exit 1; fi
          if [ "$RUN" != success ]; then echo "::error::e2e ended '$RUN'; its summary says why"; exit 1; fi
          echo "e2e passed ($MODE)."
