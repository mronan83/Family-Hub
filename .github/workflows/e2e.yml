# e2e, nightly only (01 §9.3, §9.5, D-85, D-108, D-110). It never runs on a pull request or after a
# deploy, is never a required check or a deploy input, and never cancels, delays or rolls back
# anything. Each run builds a Vercel preview of the head of main (preview settings: the test database,
# a second Supabase project that holds only made-up families; production's database never sees a
# test), waits for it to answer, empties the test database, applies every migration, loads the demo
# family, then runs Playwright against that preview through scripts/e2e-run.mjs: an assertion failure
# is red at once; a failure the infrastructure caused (a statement timeout, a reset connection, a
# Supabase or Auth 5xx, the preview not answering) re-runs that test once, and its cause is labelled in
# the run summary. A red spec opens or updates one issue, "E2E red on main: <spec>", naming each red
# test's kind and cause, and does nothing else.
name: e2e

on:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: demo-family
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # The test project (D-85); scripts/preview-db.sh refuses any other database.
      SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
      TEST_PROJECT_REF: puoctwssryisuzakhzxj
    steps:
      - name: Check configuration
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ] || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_PROJECT_ID)
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || missing+=(VERCEL_AUTOMATION_BYPASS_SECRET)
          [ -n "$SUPABASE_DB_URL" ] || missing+=(TEST_SUPABASE_DB_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::e2e is not configured yet; missing: ${missing[*]} (docs/01-technical-architecture.md §9.8)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A preview of main, built with the preview settings (test database, browser-safe keys only).
      - name: Preview of main
        run: |
          npm install --global vercel@59.23.2
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "E2E_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "Preview: $url"
      # No test starts against a deployment that isn't serving yet (up to 5 minutes).
      - name: Wait for the preview to answer
        id: ready
        run: bash scripts/e2e-ready.sh
      # The reset seeds the demo family's history from its own today, and a run takes about 10
      # minutes. One that crossed the family's midnight would compare yesterday's seed with today's
      # dates (it did once, at 04:00 UTC: a calendar window and a streak date each off by a day), so
      # a run that would end past that midnight waits for it to pass, then resets and runs.
      - name: Not across the demo family's midnight
        run: |
          # Before the first run the test database is empty: the demo family's own time zone then.
          tz=$(psql "$SUPABASE_DB_URL" -AtX -c "select timezone from public.household where id = '0de00000-0000-4000-8000-000000000001'" 2>/dev/null || true)
          tz=${tz:-America/New_York}
          left=$(( $(TZ="$tz" date -d 'tomorrow 00:00' +%s) - $(date +%s) ))
          if [ "$left" -lt 1500 ]; then
            echo "The demo family's midnight ($tz) is ${left} s away: waiting for it to pass."
            sleep $(( left + 30 ))
          fi
      - name: Empty the test database, apply main's migrations, load the demo family
        run: bash scripts/preview-db.sh
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e
        id: e2e
        run: node scripts/e2e-run.mjs --summary "$RUNNER_TEMP/e2e-summary.md" --reds "$RUNNER_TEMP/e2e-reds.json"
        env:
          E2E_REPORT: ${{ runner.temp }}/e2e-report.txt
      - name: Measurements (DEV-05 latency, WP-08 list entry)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e-report.txt" ]; then
            { echo '### Measurements'; echo; cat "$RUNNER_TEMP/e2e-report.txt"; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # Traces record request headers, the deployment-protection bypass among them, and a public
      # repository's artifacts are public (D-48): the report is kept only while the repository is private.
      - if: failure() && github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      # A red run opens or updates one issue per red spec, naming each red test's kind (infra or
      # assertion) and cause, and does nothing else (D-108, D-110). A run that failed before e2e ran
      # opens "E2E red on main: set-up", naming the step; the preview not answering is labelled as such.
      - name: Open or update "E2E red on main"
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          READY: ${{ steps.ready.outcome }}
        run: |
          sha=$(git rev-parse HEAD)
          reds="$RUNNER_TEMP/e2e-reds.json"
          if [ ! -s "$reds" ] || [ "$(jq length "$reds")" = 0 ]; then
            if [ "$READY" = failure ]; then
              cause='infra: the preview was not ready (it did not answer /api/health with "ok" in 5 minutes)'
            else
              cause='the run ended before e2e finished; see the run for the failing step'
            fi
            jq -n --arg c "$cause" '[{spec: "set-up", tests: [{test: "the run", kind: "set-up", cause: $c, then: ""}]}]' > "$reds"
          fi
          jq -c '.[]' "$reds" | while read -r entry; do
            spec=$(jq -r .spec <<< "$entry")
            rows=$(jq -r '.tests[] | "| \(.test | gsub("\\|"; "\\|")) | \(.kind) | \(.cause | gsub("\\|"; "\\|")) | \(.then) |"' <<< "$entry")
            bash scripts/open-issue.sh "E2E red on main: $spec" "The nightly e2e run on ${sha:0:7} is red in $spec.

          | Test | Kind | Cause | Then |
          |---|---|---|---|
          $rows

          Run: $RUN_URL"
          done
