# [CHR-20] Why approval alerts did or did not go (WP-63, D-88): reads production, read only, and
# reports counts and reasons only (households and parents numbered, nothing named) to the log and the
# run summary. Actions → reminders-report → Run workflow.
name: reminders-report

on:
  workflow_dispatch:
  push:
    branches: [claude/bug-approval-alerts]
    paths: [.github/workflows/reminders-report.yml, scripts/reminders-report.*]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Report
        shell: bash # pipefail: a failed read fails the step despite tee
        run: |
          { echo '```'; bash scripts/reminders-report.sh; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
