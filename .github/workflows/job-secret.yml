# Creates or rotates the job secret (01 §5.6, D-38): generated on the runner, written to Vercel's
# production environment and to Supabase Vault, never printed. Production is redeployed so the app
# holds it, then a heartbeat proves pg_cron's path end to end. Run it once to turn jobs on, and again
# whenever the secret should change: Actions → job-secret → Run workflow.
name: job-secret

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write # starts the production deploy and waits for it

concurrency:
  group: job-secret
  cancel-in-progress: false

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/job-secret.sh
