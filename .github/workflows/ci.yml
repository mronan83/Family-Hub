# PR gates (01 §9.3). Runs on every push so the checks attach to each commit; no Docker anywhere.
name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the branch's commits since main, for the model name check
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Traceability
        run: python3 docs/check_traceability.py --docs docs --tests .
      - name: No model name in commits or the pull request (D-125)
        run: node scripts/no-model-name.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  database:
    runs-on: ubuntu-24.04
    env:
      PG_MAJOR: '17'
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install Postgres and pgTAP (PGDG, matches Supabase's major version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq "postgresql-${PG_MAJOR}" "postgresql-${PG_MAJOR}-pgtap" libtap-parser-sourcehandler-pgtap-perl
          # The runner image does not create clusters automatically
          if ! pg_lsclusters -h | awk -v v="$PG_MAJOR" '$1==v && $2=="main" {found=1} END {exit !found}'; then
            sudo pg_createcluster "$PG_MAJOR" main
          fi
          sudo pg_ctlcluster "$PG_MAJOR" main start
          port="$(pg_lsclusters -h | awk -v v="$PG_MAJOR" '$1==v && $2=="main" {print $3}')"
          sudo -u postgres psql -p "$port" -c "alter user postgres password 'postgres'"
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          psql -p "$port" -h localhost -U postgres -Atc 'select version()'
      - run: bash scripts/db-test.sh
      - name: Migration runner
        run: bash scripts/db-migrate.test.sh
      - name: Preview database
        run: bash scripts/preview-db.test.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Each e2e spec's own household (D-137)
        run: node --test scripts/db-tests/*.test.mjs
      - name: Setup codes
        run: bash scripts/setup-code.test.sh
      - name: Usage readings
        run: bash scripts/usage-sample.test.sh
      - name: Reminders report
        run: bash scripts/reminders-report.test.sh

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the docs pages (broken cross-links and unknown IDs fail)
        run: pnpm docs:build --check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Layout on phones, tablets, laptops and monitors
        run: pnpm docs:layout

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # [D-127] WebKit too: the UI suite's iPhone project runs in Safari's engine (WP-100).
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Brand checks (tile style snapshots, axe contrast, manifests, fonts), Chrome and iPhone
        run: pnpm test:ui
      # [D-127] The made-up family's screens as an iPhone (WebKit) and a laptop, and the board's goal
      # cards, in Day and Evening: the pictures for a side-by-side with a mockup (WP-100).
      - name: Screenshots for the side-by-side
        if: success() || failure()
        run: |
          (pnpm --filter @familywise/web exec next start -p 3100 > /dev/null 2>&1 &)
          until curl -sf http://localhost:3100/api/health > /dev/null; do sleep 1; done
          node scripts/screen-shots.mjs --out=screen-shots
      - if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-shots
          path: screen-shots
          retention-days: 14
      # [D-110] The nightly e2e run script's verdicts on a tiny fixture suite (no preview, no database):
      # an injected statement timeout re-runs once and is labelled; an injected assertion failure never re-runs.
      - name: e2e re-run rules
        run: node --test scripts/e2e-run.selftest.mjs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: brand-checks
          path: test-results
          retention-days: 14
