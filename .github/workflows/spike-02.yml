# SPIKE-02 (01 §5.4), run by hand: reads the published calendar in the repository secret
# ICS_SPIKE_URL (owner item Y-6) the way calendar sync will. The report (what iCloud serves, and
# whether the calendar expands correctly across the clock change) lands in the run summary as counts
# and checks only: no link, no event text, no dates, so a real family calendar is safe to point at.
# Actions → spike-02 → Run workflow.
name: spike-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ICS_SPIKE_URL: ${{ secrets.ICS_SPIKE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the calendar
        shell: bash # pipefail: a failed read fails the step despite tee
        run: node apps/web/scripts/spike-02.mjs | tee -a "$GITHUB_STEP_SUMMARY"
